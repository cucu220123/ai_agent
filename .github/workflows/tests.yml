name: deterministic-regression
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      ENABLE_LOCAL_EMBEDDING: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements-tested.txt
      - run: pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
