[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-algorithm-factory"
version = "0.2.0"
description = "Agent-driven algorithm capability factory prototype"
requires-python = ">=3.10"

[project.optional-dependencies]
local-llm = ["torch>=2.3", "transformers>=4.48", "accelerate>=0.30", "safetensors>=0.4", "sentencepiece>=0.2"]
server = ["gunicorn>=22.0", "prometheus-client>=0.20", "python-multipart>=0.0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
