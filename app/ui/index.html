<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Algorithm Factory · Evidence Workbench</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#d9e3ed;background:#0c1420;font-size:15px}*{box-sizing:border-box}body{margin:0}header{padding:28px 4vw;border-bottom:1px solid #28384a;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0 0 7px}p{line-height:1.6;color:#9cafc4;margin:8px 0}main{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding:28px 4vw}aside,.panel{border:1px solid #28384a;border-radius:12px;background:#111f30;padding:20px}aside{align-self:start;position:sticky;top:20px}label{display:block;color:#b7c8dc;font-size:13px;margin:18px 0 8px}textarea,input,select{background:#0c1724;color:#e4eef8;border:1px solid #344a63;border-radius:6px;padding:10px;width:100%;font:inherit}textarea{resize:vertical;min-height:145px}button{background:#5dd3bb;color:#06231d;border:0;border-radius:6px;padding:11px 16px;cursor:pointer;font-weight:650}button:disabled{opacity:.5;cursor:wait}button.secondary{background:#233750;color:#d9e3ed}nav{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 18px}nav button{background:#152638;color:#adbed1;font-weight:500;font-size:13px}nav button.active{background:#264963;color:#b6f2ea}.badge{border:1px solid #36526a;background:#173b45;color:#8ce8d2;padding:5px 9px;border-radius:20px;font-size:12px}.badge.fail{background:#4d2634;color:#ffb0b7}.badge.mock{background:#453f24;color:#ffe89b}.panel{min-height:450px;display:none}.panel.active{display:block}h2{margin:0 0 14px;font-size:19px}h3{font-size:15px;margin-top:24px}.cards{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}.card{padding:16px;background:#192b3e;border-radius:8px;min-width:140px}.card strong{font-size:23px;display:block}.card small{color:#9cafc4}pre{font:12px/1.65 Consolas,monospace;white-space:pre-wrap;word-break:break-word;padding:16px;background:#09131e;border-radius:6px;max-height:650px;overflow:auto;color:#bcd1e6}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:11px;border-bottom:1px solid #2b3b4e;vertical-align:top}th{color:#89a7c5}.scroll{overflow:auto}svg{width:100%;min-height:350px;background:#0b1726;border:1px solid #29415a;border-radius:8px}.toolbar{display:flex;gap:10px;margin:12px 0}.toolbar select{width:auto;min-width:180px}details{margin:12px 0}summary{cursor:pointer;color:#8ee0d3}.event{border-left:2px solid #2f6d75;padding:4px 12px;margin:7px 0;font:12px/1.5 Consolas,monospace}.muted{color:#90a4bc;font-size:12px}#status{margin:18px 0;white-space:pre-wrap}#runButton{width:100%;margin-top:22px}@media(max-width:900px){main{grid-template-columns:1fr}aside{position:static}header{align-items:start}.toolbar{flex-wrap:wrap}}
</style></head><body>
<header><div><h1>AI Algorithm Factory</h1><p>算法能力工厂 · 从需求到验证结果，每一步都有证据</p></div><span class="badge">Evidence Workbench / v0.3</span></header>
<main><aside><strong>提交能力需求</strong><label for="description">自然语言描述</label><textarea id="description">根据客户行为预测未来30天是否流失，目标列 churn，要求 ROC-AUC 不低于 0.80，输出流失概率，优先可解释方案。</textarea>
<label for="dataPath">项目内数据路径</label><input id="dataPath" value="data/churn_demo.csv">
<label for="provider">模型运行方式</label><select id="provider"><option value="auto">真实 LLM 优先（auto）</option><option value="openai">OpenAI-compatible API</option><option value="local">本地真实模型</option><option value="mock">离线 Mock / 测试</option></select>
<button id="runButton">运行完整工作流</button><div id="status" role="status">等待提交。真实模式不会将模板结果冒充 LLM 成功。</div>
<label for="history">查看已有报告</label><select id="history"><option value="">选择运行记录</option></select><p class="muted">历史只提供先验。最终选择取决于本次数据上的实际验证。</p></aside>
<section><nav id="tabs"></nav><div id="panels"></div></section></main>
<script>
const labels=['总览','结构化需求','检索与图谱','候选与搜索','生成代码','验证结果','修复历史','知识写回','执行轨迹'];let current=null;
const el=(tag,text,cls)=>{const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x};
const pretty=x=>JSON.stringify(x,null,2);
labels.forEach((label,i)=>{const b=el('button',label,i===0?'active':'');b.onclick=()=>{document.querySelectorAll('nav button,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('panel'+i).classList.add('active')};document.getElementById('tabs').append(b);const p=el('article',undefined,'panel'+(i===0?' active':''));p.id='panel'+i;p.append(el('h2',label),el('p','运行完成后，在这里查看对应证据。'));document.getElementById('panels').append(p)});
function panel(i){const p=document.getElementById('panel'+i);p.replaceChildren(el('h2',labels[i]));return p}
function jsonBlock(p,label,value){const d=el('details');d.append(el('summary',label),el('pre',pretty(value)));p.append(d)}
function table(p,head,rows){const div=el('div',undefined,'scroll'),t=el('table'),h=el('tr');head.forEach(x=>h.append(el('th',x)));t.append(h);rows.forEach(row=>{const r=el('tr');row.forEach(x=>r.append(el('td',String(x??'—'))));t.append(r)});div.append(t);p.append(div)}
async function request(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw Error(data.detail||pretty(data));return data}
function drawGraph(p,graph,type='all'){const allNodes=graph.nodes||[];let nodes=allNodes;if(type!=='all'){const anchors=new Set(allNodes.filter(n=>n.type===type).map(n=>n.id)),ids=new Set(anchors);(graph.edges||[]).forEach(e=>{if(anchors.has(e.source)||anchors.has(e.target)){ids.add(e.source);ids.add(e.target)}});nodes=allNodes.filter(n=>ids.has(n.id)).sort((a,b)=>Number(anchors.has(b.id))-Number(anchors.has(a.id)))}nodes=nodes.slice(0,30);nodes.sort((a,b)=>String(a.type).localeCompare(String(b.type))||String(a.id).localeCompare(String(b.id)));const ids=new Set(nodes.map(n=>n.id)),edges=(graph.edges||[]).filter(e=>ids.has(e.source)&&ids.has(e.target));const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 1000 '+Math.max(250,Math.ceil(nodes.length/5)*84+35));const position={};nodes.forEach((n,i)=>{const col=i%5,row=Math.floor(i/5);position[n.id]=[105+col*196,60+row*84]});const details=el('pre','点击节点查看完整属性和来源。');edges.forEach(e=>{const a=position[e.source],b=position[e.target],line=document.createElementNS(ns,'line');for(const [k,v]of Object.entries({x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#3a6078','stroke-width':1.1}))line.setAttribute(k,v);const title=document.createElementNS(ns,'title');title.textContent=e.source+' — '+e.relation+' → '+e.target;line.append(title);svg.append(line)});nodes.forEach(n=>{const [x,y]=position[n.id],g=document.createElementNS(ns,'g'),rect=document.createElementNS(ns,'rect'),text=document.createElementNS(ns,'text');for(const [k,v]of Object.entries({x:x-86,y:y-24,width:172,height:49,rx:8,fill:n.type==='ValidationRun'?'#214e54':n.type==='FailureExperience'?'#582d3a':'#1d354e',stroke:'#6594aa'}))rect.setAttribute(k,v);for(const [k,v]of Object.entries({x,y:y+4,fill:'#d6e7f4','font-size':11,'text-anchor':'middle'}))text.setAttribute(k,v);text.textContent=(n.name||n.run_id||n.id).slice(0,21);const caption=document.createElementNS(ns,'text');caption.setAttribute('x',x);caption.setAttribute('y',y+16);caption.setAttribute('fill','#94b3c8');caption.setAttribute('font-size','10');caption.setAttribute('text-anchor','middle');text.setAttribute('y',y-3);if(['ValidationRun','FailureExperience','RepairExperience','AlgorithmVersion'].includes(n.type)){const version=String(n.id).match(/(?:_|:)v(\d+)$/)?.[1];text.textContent=n.type+(version?' v'+version:'');caption.textContent=String(n.status||n.failure_type||n.algorithm_id||n.id).replace('algorithm_','').slice(0,25)}else{caption.textContent=n.type}const title=document.createElementNS(ns,'title');title.textContent=n.type+': '+n.id;g.append(rect,text,caption,title);g.style.cursor='pointer';g.onclick=()=>details.textContent=pretty(n);svg.append(g)});p.append(svg,el('p',nodes.length+' 个节点 / '+edges.length+' 条关系；悬停连线查看关系，完整节点与路径见 JSON。','muted'),details)}
function render(r){current=r;const explanation=r.explanation_review?.explanation||r.explanation;let p=panel(0);p.append(el('span',r.validation.status+' · '+(r.llm_trace.real_winner?'真实 LLM 代码':r.llm_trace.strict_real_mode?'真实模式未通过':'Mock / 确定性模式'),'badge'+(r.validation.status==='passed'?'':' fail')),el('h3',r.selected_plan.algorithm_name),el('p',explanation?.why_this_plan||r.selected_plan.rationale));const cards=el('div',undefined,'cards');Object.entries(r.validation.metrics).sort(([a],[b])=>Number(b===r.spec.metrics?.[0])-Number(a===r.spec.metrics?.[0])).forEach(([k,v])=>{const c=el('div',undefined,'card');c.append(el('strong',Number(v).toFixed(4)),el('small',k));cards.append(c)});p.append(cards);(explanation?.limitations||[]).forEach(x=>p.append(el('p','• '+x)));jsonBlock(p,r.explanation_review?'复核后的解释（原始报告保留）':'基于真实证据的完整解释',explanation);if(r.explanation_review)jsonBlock(p,'解释复核记录',r.explanation_review);
p=panel(1);p.append(el('pre',pretty(r.spec)));jsonBlock(p,'RequirementAgent 调用与校验',r.llm_trace.requirement);
p=panel(2);p.append(el('p','Entity linking → 1–3 hop graph search → 子图序列化 → Planner context'));jsonBlock(p,'实体链接与真实路径', {anchors:r.knowledge.graph_evidence.anchors,paths:r.knowledge.graph_evidence.paths});const controls=el('div',undefined,'toolbar'),filter=el('select');['all','ValidationRun','FailureExperience','RepairExperience'].forEach(x=>{const o=el('option',x);o.value=x;filter.append(o)});const focus=el('button','查看本次写回子图','secondary');controls.append(filter,focus);p.append(controls);const graph=el('div');let displayedGraph=r.knowledge.graph_evidence;p.append(graph);drawGraph(graph,displayedGraph);filter.setAttribute('aria-label','图谱节点类型');filter.onchange=()=>{graph.replaceChildren();drawGraph(graph,displayedGraph,filter.value)};focus.onclick=async()=>{try{const g=await request('/graph/subgraph?focus='+encodeURIComponent(r.run_id));displayedGraph=g;graph.replaceChildren();drawGraph(graph,displayedGraph,filter.value)}catch(e){graph.textContent=e.message}};jsonBlock(p,'实际发送给 Planner 的上下文',r.knowledge.planning_context);jsonBlock(p,'融合检索证据',r.knowledge.semantic_evidence);
p=panel(3);table(p,['候选','状态','先验分数','配置'],r.candidate_results.map(c=>[c.plan.algorithm_name,c.validation.status,c.plan.search_score.toFixed(4),pretty(c.plan.hyperparameters)]));jsonBlock(p,'Beam 扩展、剪枝与入选原因',r.search_trace);jsonBlock(p,'LLM 方案建议',r.knowledge.planner_advice);
p=panel(4);const choice=el('select'),code=el('pre','选择候选查看代码。');r.candidate_results.forEach(c=>{const o=el('option',c.plan.algorithm_name+' / '+c.code_source);o.value=c.plan.algorithm_id;choice.append(o)});const loadCode=async()=>{try{const x=await request('/run/'+r.run_id+'/code?candidate='+encodeURIComponent(choice.value));code.textContent=x.source}catch(e){code.textContent=e.message}};choice.onchange=loadCode;p.append(choice,code);loadCode();
p=panel(5);table(p,['检查','结果','详情'],Object.entries(r.validation.checks).map(([k,v])=>[k,v.passed===undefined?'记录':v.passed?'PASS':'FAIL',pretty(v)]));jsonBlock(p,'所有候选的统一验证报告',r.candidate_results.map(c=>({candidate:c.plan.algorithm_id,validation:c.validation})));
p=panel(6);r.candidate_results.forEach(c=>{p.append(el('h3',c.plan.algorithm_name));table(p,['版本','状态','父版本','SHA-256'],c.attempts.map(a=>[a.version_id,a.validation.status,a.parent_version,a.code_hash]));jsonBlock(p,'诊断与修复',c.repair_history)});
p=panel(7);p.append(el('pre',pretty(r.writeback)));jsonBlock(p,'知识抽取 / 缓存证据',r.extraction_trace);
p=panel(8);r.event_log.forEach(e=>p.append(el('div',e.sequence+' ['+e.agent+'] '+e.status+(e.tool?' / '+e.tool:''),'event')));jsonBlock(p,'真实 LLM 调用：模型、耗时、tokens、重试',r.llm_trace.calls)}
async function refresh(){try{const r=await request('/reports');const select=document.getElementById('history');select.replaceChildren(el('option','选择运行记录'));r.items.forEach(x=>{const o=el('option',x.run_id+' · '+x.status);o.value=x.run_id;select.append(o)})}catch(e){}}
document.getElementById('history').onchange=async e=>{if(e.target.value)try{render(await request('/run/'+e.target.value))}catch(err){document.getElementById('status').textContent=err.message}};
document.getElementById('runButton').onclick=async()=>{const button=document.getElementById('runButton'),status=document.getElementById('status');button.disabled=true;status.textContent='服务端正在执行。完成后将显示真实逐步轨迹与验证结果。';try{const r=await request('/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({description:document.getElementById('description').value,data_path:document.getElementById('dataPath').value,provider:document.getElementById('provider').value})});render(r);status.textContent='完成：'+r.run_id+' / '+r.validation.status;refresh()}catch(e){status.textContent='运行失败：'+e.message}finally{button.disabled=false}};refresh();
</script></body></html>
